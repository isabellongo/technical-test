# =============================================================================
# Driva Pipeline - Docker Compose
# =============================================================================
# Serviços: postgres, n8n, api, frontend
# Para teste da Fase 1.4: docker-compose up -d postgres
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - Data Warehouse
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: driva-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql roda automaticamente na primeira subida (volume vazio)
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # n8n - Orquestração dos workflows
  # ---------------------------------------------------------------------------
  # DECISÃO FASE 3: N8N_DATABASE_TYPE=postgres para persistir workflows no DW.
  # n8n usa o mesmo Postgres do projeto; tabelas n8n ficam em schema separado.
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: driva-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin
      N8N_HOST: localhost
      N8N_PORT: 5678
      NODE_ENV: production
      # Persistir workflows e execuções no Postgres
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API Go - Fonte + Analytics
  # ---------------------------------------------------------------------------
  api:
    build: ./api
    container_name: driva-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_PORT: "3000"
      API_KEY: ${API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend será adicionado na Fase 4

volumes:
  postgres_data:
  n8n_data:
