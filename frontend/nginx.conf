server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Ensure Docker's internal DNS resolver is available for name lookups
  # (some nginx images require an explicit resolver when resolving service
  # names at runtime). This is safe when proxy_pass uses a static host.
  resolver 127.0.0.11 valid=30s;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the internal `api` service to avoid CORS. Use a
  # static proxy_pass (no nginx variables) so nginx performs normal DNS
  # resolution at connect time and does not require the resolver for
  # variable-based resolution.
  location /api/ {
    # Trailing slash ensures the original request URI is passed through.
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 90;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
